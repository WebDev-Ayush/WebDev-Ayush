<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="t d">
  <title id="t">Ayush Bisht - profile.sh --live</title>
  <desc id="d">Terminal-style HUD showing profile, tech stack and status for Ayush Bisht, CS student and app developer.</desc>

  <rect x="0.5" y="0.5" width="899" height="469" rx="10" ry="10" fill="#0d1117" stroke="#30363d"/>

  <foreignObject x="0" y="0" width="900" height="470">
    <div xmlns="http://www.w3.org/1999/xhtml" class="win">
      <style>
        .win, .win * { box-sizing: border-box; margin: 0; padding: 0; }
        .win {
          width: 900px; height: 470px; border-radius: 10px; overflow: hidden;
          background: #0d1117; color: #f0f6fc;
          font-family: 'Courier New', 'Fira Code', 'JetBrains Mono', monospace;
          font-size: 12.5px; line-height: 1.3; position: relative;
        }

        /* ---------- title bar ---------- */
        .bar {
          height: 38px; display: flex; align-items: center; justify-content: space-between;
          padding: 0 14px; background: #161b22; border-bottom: 1px solid #30363d;
        }
        .dots { display: flex; gap: 8px; width: 120px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .r { background: #ff5f56; } .y { background: #ffbd2e; } .g { background: #27c93f; }
        .title { color: #8b949e; font-size: 12.5px; letter-spacing: 0.5px; }
        .title b { color: #58a6ff; font-weight: normal; }
        .clock { width: 120px; text-align: right; color: #8b949e; font-size: 11px; }

        /* ---------- body ---------- */
        .body { display: flex; height: 392px; }

        /* left: viewport */
        .left { width: 300px; padding: 18px 18px 14px 20px; border-right: 1px solid #30363d; }
        .cap { color: #58a6ff; font-size: 11.5px; letter-spacing: 1px; margin-bottom: 10px; }
        .cap i { font-style: normal; color: #3fb950; }
        .view {
          position: relative; width: 260px; height: 292px; background: #010409;
          border: 1px solid #30363d; overflow: hidden;
        }
        .shot {
          display: block; width: 100%; height: 100%; object-fit: cover;
          filter: grayscale(1) contrast(1.25) brightness(0.9);
        }
        .scan {
          position: absolute; inset: 0; pointer-events: none;
          background: repeating-linear-gradient(to bottom, rgba(88,166,255,0.07) 0, rgba(88,166,255,0.07) 1px, transparent 1px, transparent 3px);
        }
        .sweep {
          position: absolute; left: 0; right: 0; height: 36px; top: -36px; pointer-events: none;
          background: linear-gradient(to bottom, rgba(88,166,255,0), rgba(88,166,255,0.22), rgba(88,166,255,0));
          animation: sweep 4.5s linear infinite;
        }
        .ch { position: absolute; background: rgba(88,166,255,0.45); pointer-events: none; }
        .ch.h { left: 0; right: 0; top: 50%; height: 1px; }
        .ch.v { top: 0; bottom: 0; left: 50%; width: 1px; }
        .ring {
          position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px;
          border: 1px solid #58a6ff; border-radius: 50%; pointer-events: none;
          animation: lock 2.4s ease-in-out infinite;
        }
        .br { position: absolute; width: 18px; height: 18px; border: 2px solid #58a6ff; pointer-events: none; }
        .tl { top: 4px; left: 4px; border-right: 0; border-bottom: 0; }
        .tr { top: 4px; right: 4px; border-left: 0; border-bottom: 0; }
        .bl { bottom: 4px; left: 4px; border-right: 0; border-top: 0; }
        .brr { bottom: 4px; right: 4px; border-left: 0; border-top: 0; }
        .tag { position: absolute; left: 10px; bottom: 26px; color: #58a6ff; font-size: 10px; letter-spacing: 1px; background: rgba(1,4,9,0.75); padding: 1px 4px; }
        .tag.t2 { left: auto; right: 10px; top: 26px; bottom: auto; color: #8b949e; }
        .coords { margin-top: 8px; color: #8b949e; font-size: 10.5px; display: flex; justify-content: space-between; }

        /* right: telemetry */
        .right { flex: 1; padding: 18px 22px 10px 24px; }
        .hd { color: #58a6ff; letter-spacing: 1px; font-size: 11.5px; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .hd span:last-child { color: #8b949e; }
        .row { display: flex; height: 20px; align-items: baseline; white-space: nowrap; }
        .k { width: 128px; color: #8b949e; flex: none; }
        .k b { color: #58a6ff; font-weight: normal; }
        .k::after { content: ' :'; color: #30363d; }
        .v { color: #f0f6fc; overflow: hidden; text-overflow: ellipsis; padding-left: 6px; }
        .v em { font-style: normal; color: #58a6ff; }
        .sep { height: 1px; margin: 5px 0 6px; background: repeating-linear-gradient(to right, #30363d 0, #30363d 4px, transparent 4px, transparent 8px); }
        .cur { display: inline-block; width: 8px; height: 13px; background: #58a6ff; vertical-align: -2px; margin-left: 4px; animation: blink 1s steps(1) infinite; }

        /* ---------- status ---------- */
        .status {
          position: absolute; left: 0; right: 0; bottom: 0; height: 40px;
          display: flex; align-items: center; justify-content: space-between;
          padding: 0 18px; background: #161b22; border-top: 1px solid #30363d; font-size: 12px;
        }
        .ok { color: #3fb950; text-shadow: 0 0 8px rgba(63,185,80,0.7); letter-spacing: 1px; }
        .ok .pulse { display: inline-block; animation: pulse 1.8s ease-in-out infinite; }
        .meta { color: #8b949e; font-size: 11px; }
        .meta b { color: #58a6ff; font-weight: normal; }

        @keyframes sweep { from { top: -36px; } to { top: 100%; } }
        @keyframes blink { 50% { opacity: 0; } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
        @keyframes lock { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(0.82); opacity: 0.5; } }
        @media (prefers-reduced-motion: reduce) {
          .sweep, .cur, .pulse, .ring { animation: none; }
        }
      </style>

      <!-- TITLE BAR -->
      <div class="bar">
        <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
        <div class="title">~/ayush <b>$</b> profile.sh --live</div>
        <div class="clock">tty1 &#183; utf-8</div>
      </div>

      <div class="body">
        <!-- LEFT: VISUAL MAP -->
        <div class="left">
          <div class="cap">[ VISUAL_MAP // <i>ACTIVE</i> ]</div>
          <div class="view">
            <!--
              IMAGE PLACEHOLDER
              GitHub blocks external URLs inside SVGs, so the photo must be embedded as a data URI.
              Replace the src below with: data:image/jpeg;base64,<YOUR_BASE64>
              (keep the photo small, ~300x340 px, under ~60 KB)
            -->
            <img class="shot" alt="subject" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 120'%3E%3Crect width='100' height='120' fill='%23161b22'/%3E%3Ccircle cx='50' cy='46' r='18' fill='%2330363d'/%3E%3Cpath d='M14 120c0-26 16-40 36-40s36 14 36 40z' fill='%2330363d'/%3E%3C/svg%3E"/>
            <div class="scan"></div>
            <div class="sweep"></div>
            <div class="ch h"></div><div class="ch v"></div>
            <div class="ring"></div>
            <div class="br tl"></div><div class="br tr"></div><div class="br bl"></div><div class="br brr"></div>
            <div class="tag t2">REC &#9679;</div>
            <div class="tag">ID: AB-0902</div>
          </div>
          <div class="coords"><span>LAT 28.98&#176;N</span><span>LON 77.71&#176;E</span></div>
        </div>

        <!-- RIGHT: SYSTEM.INFO -->
        <div class="right">
          <div class="hd"><span>SYSTEM.INFO</span><span>build: student.stable</span></div>

          <div class="row"><span class="k">Subject</span><span class="v">Ayush Bisht</span></div>
          <div class="row"><span class="k">Role</span><span class="v">CS Student <em>//</em> App Developer</span></div>
          <div class="row"><span class="k">Origin</span><span class="v">Meerut, UP, IN &#183; MIET</span></div>
          <div class="row"><span class="k">Focus</span><span class="v">App Development, DSA</span></div>
          <div class="row"><span class="k">Toolchain</span><span class="v">Git, Postman, Bash, Linux</span></div>

          <div class="sep"></div>

          <div class="row"><span class="k"><b>Core.</b>Lang</span><span class="v">C, Java, Python, JavaScript, TypeScript</span></div>
          <div class="row"><span class="k"><b>Core.</b>Frontend</span><span class="v">HTML5, CSS3, React, Next.js, Tailwind</span></div>
          <div class="row"><span class="k"><b>Core.</b>UI.Kit</span><span class="v">Materialize, wxWidgets</span></div>
          <div class="row"><span class="k"><b>Core.</b>Backend</span><span class="v">Node.js, Express</span></div>
          <div class="row"><span class="k"><b>Core.</b>Database</span><span class="v">MongoDB, MySQL, PostgreSQL</span></div>
          <div class="row"><span class="k"><b>Core.</b>Infra</span><span class="v">AWS, Azure, Docker, Linux</span></div>

          <div class="sep"></div>

          <div class="row"><span class="k"><b>Grid.</b>LinkedIn</span><span class="v">in/ayush-bisht-a42442261</span></div>
          <div class="row"><span class="k"><b>Grid.</b>GitHub</span><span class="v">@WebDev-Ayush</span></div>
          <div class="row"><span class="k"><b>Grid.</b>Mail</span><span class="v">ayushbisht0902@gmail.com<span class="cur"></span></span></div>
        </div>
      </div>

      <!-- STATUS BAR -->
      <div class="status">
        <span class="ok"><span class="pulse">&#9679;</span> ALL SYSTEMS NOMINAL</span>
        <span class="meta">STATUS: <b>200 OK</b> &#183; uptime: learning.forever</span>
      </div>
    </div>
  </foreignObject>
</svg>
